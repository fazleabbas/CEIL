<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Cleanup Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cleanup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        .cleanup-icon {
            font-size: 4rem;
            color: #667eea;
        }
        .cleanup-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
        }
        .cleanup-item.done {
            border-left-color: #28a745;
            background: #d4edda;
        }
        .cleanup-item.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .log-area {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
        .log-area.show {
            display: block;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="cleanup-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check cleanup-icon"></i>
            <h2 class="mt-3">System Cleanup Tool</h2>
            <p class="text-muted">Clear all caches and reset the system</p>
        </div>

        <div id="cleanupItems">
            <div class="cleanup-item" id="item1">
                <i class="bi bi-circle"></i> Close Active Connections
            </div>
            <div class="cleanup-item" id="item2">
                <i class="bi bi-circle"></i> IndexedDB Cleanup
            </div>
            <div class="cleanup-item" id="item3">
                <i class="bi bi-circle"></i> Service Worker Unregister
            </div>
            <div class="cleanup-item" id="item4">
                <i class="bi bi-circle"></i> Cache Storage Clear
            </div>
            <div class="cleanup-item" id="item5">
                <i class="bi bi-circle"></i> LocalStorage Clear
            </div>
            <div class="cleanup-item" id="item6">
                <i class="bi bi-circle"></i> SessionStorage Clear
            </div>
        </div>

        <div class="d-grid gap-2 mt-4">
            <button class="btn btn-danger btn-lg" id="cleanupBtn" onclick="performCleanup()">
                <i class="bi bi-trash3"></i> Start Cleanup
            </button>
            <button class="btn btn-success btn-lg" id="reloadBtn" onclick="forceReload()" style="display:none;">
                <i class="bi bi-arrow-clockwise"></i> Reload Page
            </button>
        </div>

        <div id="logArea" class="log-area"></div>

        <div class="alert alert-info mt-4">
            <i class="bi bi-info-circle"></i>
            <strong>Important:</strong> Close all other tabs/windows of your application before running cleanup!
        </div>
    </div>

    <script>
        let logArea;

        function log(message, type = 'info') {
            if (!logArea) {
                logArea = document.getElementById('logArea');
            }
            logArea.classList.add('show');
            
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✓' : '→';
            const line = `[${timestamp}] ${prefix} ${message}\n`;
            
            logArea.innerHTML += line;
            logArea.scrollTop = logArea.scrollHeight;
        }

        function markItemStatus(itemId, status) {
            const item = document.getElementById(itemId);
            const icon = item.querySelector('i');
            
            if (status === 'working') {
                item.classList.remove('done', 'error');
                icon.className = 'bi bi-arrow-repeat pulse';
            } else if (status === 'done') {
                item.classList.add('done');
                item.classList.remove('error');
                icon.className = 'bi bi-check-circle-fill';
            } else if (status === 'error') {
                item.classList.add('error');
                item.classList.remove('done');
                icon.className = 'bi bi-x-circle-fill';
            }
        }

        async function performCleanup() {
            const btn = document.getElementById('cleanupBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Cleaning...';
            
            log('=== Starting System Cleanup ===');
            log('');

            // 0. Close any active IndexedDB connections
            try {
                markItemStatus('item1', 'working');
                log('Closing active database connections...');
                
                // Give time for any active connections to close
                await new Promise(resolve => setTimeout(resolve, 500));
                
                markItemStatus('item1', 'done');
                log('✓ Connections closed', 'success');
            } catch (error) {
                markItemStatus('item1', 'error');
                log(`Error: ${error.message}`, 'error');
            }
            
            log('');

            // 1. Clear IndexedDB
            try {
                markItemStatus('item2', 'working');
                log('Clearing IndexedDB...');
                
                // Use a different approach for better compatibility
                const databaseNames = ['InventoryDB']; // Add your database names here
                
                for (const dbName of databaseNames) {
                    log(`Attempting to delete: ${dbName}`);
                    
                    const deleteRequest = indexedDB.deleteDatabase(dbName);
                    
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            log(`⚠️ Timeout deleting ${dbName}, but continuing...`, 'error');
                            resolve(); // Resolve anyway to continue
                        }, 5000); // 5 second timeout
                        
                        deleteRequest.onsuccess = () => {
                            clearTimeout(timeout);
                            log(`✓ Deleted: ${dbName}`, 'success');
                            resolve();
                        };
                        
                        deleteRequest.onerror = (event) => {
                            clearTimeout(timeout);
                            log(`Error deleting ${dbName}: ${event.target.error}`, 'error');
                            resolve(); // Resolve to continue with other cleanups
                        };
                        
                        deleteRequest.onblocked = () => {
                            clearTimeout(timeout);
                            log(`⚠️ ${dbName} is blocked (in use). Close all tabs and retry.`, 'error');
                            resolve();
                        };
                    });
                }
                
                markItemStatus('item2', 'done');
                log('✓ IndexedDB cleanup complete', 'success');
            } catch (error) {
                markItemStatus('item2', 'error');
                log(`Error clearing IndexedDB: ${error.message}`, 'error');
            }
            
            log('');

            // 2. Unregister Service Workers
            try {
                markItemStatus('item3', 'working');
                log('Unregistering Service Workers...');
                
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`Found ${registrations.length} service worker(s)`);
                    
                    for (const registration of registrations) {
                        log(`Unregistering: ${registration.scope}`);
                        await registration.unregister();
                        log(`✓ Unregistered`, 'success');
                    }
                    
                    markItemStatus('item3', 'done');
                    log('✓ Service workers cleanup complete', 'success');
                } else {
                    markItemStatus('item3', 'done');
                    log('Service workers not supported', 'info');
                }
            } catch (error) {
                markItemStatus('item3', 'error');
                log(`Error unregistering service workers: ${error.message}`, 'error');
            }
            
            log('');

            // 3. Clear Cache Storage
            try {
                markItemStatus('item4', 'working');
                log('Clearing Cache Storage...');
                
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`Found ${cacheNames.length} cache(s)`);
                    
                    for (const cacheName of cacheNames) {
                        log(`Deleting cache: ${cacheName}`);
                        await caches.delete(cacheName);
                        log(`✓ Deleted: ${cacheName}`, 'success');
                    }
                    
                    markItemStatus('item4', 'done');
                    log('✓ Cache storage cleanup complete', 'success');
                } else {
                    markItemStatus('item4', 'done');
                    log('Cache storage not supported', 'info');
                }
            } catch (error) {
                markItemStatus('item4', 'error');
                log(`Error clearing cache storage: ${error.message}`, 'error');
            }
            
            log('');

            // 4. Clear LocalStorage
            try {
                markItemStatus('item5', 'working');
                log('Clearing LocalStorage...');
                
                const itemCount = localStorage.length;
                log(`Found ${itemCount} item(s) in localStorage`);
                
                localStorage.clear();
                
                markItemStatus('item5', 'done');
                log('✓ LocalStorage cleared', 'success');
            } catch (error) {
                markItemStatus('item5', 'error');
                log(`Error clearing localStorage: ${error.message}`, 'error');
            }
            
            log('');

            // 5. Clear SessionStorage
            try {
                markItemStatus('item6', 'working');
                log('Clearing SessionStorage...');
                
                const itemCount = sessionStorage.length;
                log(`Found ${itemCount} item(s) in sessionStorage`);
                
                sessionStorage.clear();
                
                markItemStatus('item6', 'done');
                log('✓ SessionStorage cleared', 'success');
            } catch (error) {
                markItemStatus('item6', 'error');
                log(`Error clearing sessionStorage: ${error.message}`, 'error');
            }
            
            log('');
            log('=== Cleanup Complete ===', 'success');
            log('');
            log('✓ All cleanup tasks finished!');
            log('');
            log('NEXT STEPS:');
            log('1. Click "Reload Page" button below');
            log('2. Or press Ctrl+Shift+R (Cmd+Shift+R on Mac)');
            log('3. Close ALL browser tabs with your app');
            log('4. Open a fresh tab to start clean');

            // Show reload button
            btn.style.display = 'none';
            document.getElementById('reloadBtn').style.display = 'block';
        }

        function forceReload() {
            // Force hard reload
            window.location.href = window.location.href + '?t=' + Date.now();
        }
    </script>
</body>
</html>
